name: Mupen64Plus-AE

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: 'temurin'

    # The runner image ships with the Android SDK; just add the NDK version the project pins
    - name: Install Android NDK
      run: |
        SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        yes | "$SDKMANAGER" --licenses > /dev/null || true
        "$SDKMANAGER" --install "ndk;26.1.10909125" > /dev/null
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends file gawk

    - name: Build APK
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Mupen64PlusAE-AYN-Thor
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: error

    # Ready-to-install APK on the repository's Releases page (no zip, no login needed)
    - name: Publish release
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      env:
        GH_TOKEN: ${{ github.token }}
        NOTES: ${{ github.event.head_commit.message }}
      run: |
        cp app/build/outputs/apk/release/Mupen64PlusAE-release.apk "M64-DS-1.0.${GITHUB_RUN_NUMBER}.apk"
        gh release create "m64ds-1.0.${GITHUB_RUN_NUMBER}" "M64-DS-1.0.${GITHUB_RUN_NUMBER}.apk" \
          --title "M64-DS 1.0.${GITHUB_RUN_NUMBER}" \
          --notes "$NOTES" \
          --target "${GITHUB_SHA}" --latest
