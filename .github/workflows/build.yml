name: Mupen64Plus-AE

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: 'temurin'

    # The runner image ships with the Android SDK; just add the NDK version the project pins
    - name: Install Android NDK
      run: |
        SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        yes | "$SDKMANAGER" --licenses > /dev/null || true
        "$SDKMANAGER" --install "ndk;26.1.10909125" > /dev/null
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

    - name: Install build dependencies
      timeout-minutes: 10
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends file gawk

    - name: Build APK
      timeout-minutes: 60
      run: |
        chmod +x gradlew
        set -o pipefail
        if ! ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log; then
          # Show the errors as annotations (readable without downloading the log)
          grep -E "error:|ERROR|FAILED|What went wrong|AAPT|not found|Exception" build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: M64-EXP
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: error

    # Ready-to-install APK on the repository's Releases page. The app's updater looks for the
    # newest release tagged exp-x.y.z and offers it automatically.
    - name: Publish release
      if: github.event_name == 'push' && github.ref == 'refs/heads/exp'
      env:
        GH_TOKEN: ${{ github.token }}
        NOTES: ${{ github.event.head_commit.message }}
      run: |
        V="1.0.${GITHUB_RUN_NUMBER}"
        cp app/build/outputs/apk/release/Mupen64PlusAE-release.apk "M64-EXP-${V}.apk"
        gh release create "exp-${V}" "M64-EXP-${V}.apk" \
          --title "M64 EXP ${V}" \
          --notes "$NOTES" \
          --target "${GITHUB_SHA}" --latest=false
