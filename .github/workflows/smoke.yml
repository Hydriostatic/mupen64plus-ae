name: Smoke test (emulator)

# Runs the latest released APK on an Android emulator with a simulated second screen,
# opens the menus/settings pages, and keeps screenshots + the crash log as an artifact.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test (empty = latest)
        required: false
      mode:
        description: "menus or game"
        required: false
        default: menus

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Download APK
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="${{ github.event.inputs.tag }}"
        if [ -z "$TAG" ]; then gh release download --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir apk
        else gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir apk; fi
        ls -la apk
        # Public-domain sound test ROM (PeterLemon/N64, unlicense) for the game test
        mkdir -p rom
        curl -sSL -o rom/test.n64 "https://raw.githubusercontent.com/PeterLemon/N64/master/Sound/PCM/LongShot/STEREO/16BIT/LongShotSTEREO16BIT.N64"
        ls -la rom

    - name: Run on emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        target: google_apis
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        script: bash .github/smoke/${{ github.event.inputs.mode == 'game' && 'game' || 'run' }}.sh

    - name: Push results to the smoke-results branch
      if: always()
      run: |
        cd smoke
        git init -q -b smoke-results
        git config user.name "smoke-test"
        git config user.email "smoke@localhost"
        git add -A && git commit -qm "Smoke test results ${GITHUB_RUN_ID}"
        git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" smoke-results

    - name: Keep results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: smoke-results
        path: smoke/
