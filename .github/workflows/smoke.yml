name: Smoke test (emulator)

# Runs the latest released APK on an Android emulator with a simulated second screen,
# opens the menus/settings pages, and keeps screenshots + the crash log as an artifact.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test (empty = latest)
        required: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Download APK
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="${{ github.event.inputs.tag }}"
        if [ -z "$TAG" ]; then gh release download --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir apk
        else gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir apk; fi
        ls -la apk

    - name: Run on emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        target: google_apis
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        script: bash .github/smoke/run.sh

    - name: Keep results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: smoke-results
        path: smoke/
